name: Set up Node and install
description: Node 24 with the npm cache, then a clean install from the lockfile. One place for the Node version of every workflow.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
