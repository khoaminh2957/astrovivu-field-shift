name: Pull request

# Housekeeping on the pull request itself. Neither job checks out code.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  title:
    name: Title follows the commit convention
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A squash merge writes the title into the history of main: CONTRIBUTING.md, section 3.
          pattern='^(feat|fix|data|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9][a-z0-9/._-]*\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Title accepted: $TITLE"
          else
            echo "::error title=Pull request title::Write it as type(scope): what was done, for example 'fix(scoring): pH gate no longer zeroes alfalfa'. Types: feat, fix, data, docs, test, refactor, perf, build, ci, chore, revert."
            exit 1
          fi

  labels:
    name: Label by area
    # A fork and Dependabot get a read-only token: the labels cannot be written there.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
      issues: write # creates a label the first time it is used
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
