name: Security

# Supply chain and secrets: what a change adds to the dependencies, whether a key slipped into a
# commit, and (weekly) whether a dependency already in use has a known vulnerability.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1' # Mondays 03:41 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: New dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scan reads commits, not only the files of the last one
          persist-credentials: false
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A pull request and a push scan their own commits; the weekly run scans the whole history.
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$BASE_SHA..$HEAD_SHA" ;;
            push) range="$BEFORE_SHA..$GITHUB_SHA" ;;
            *) range="" ;;
          esac
          args=(git /repo --redact --no-banner)
          if [ -n "$range" ]; then args+=("--log-opts=$range"); fi
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f "${args[@]}" # v8.30.1

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Packages are the ones their publishers signed
        run: npm audit signatures
      - name: Known vulnerabilities in what ships to users
        run: npm audit --omit=dev --audit-level=high
